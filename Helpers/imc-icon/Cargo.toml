# Helper fuori dal workspace Swift: si compila con Scripts/build-icon-helper.sh
# e finisce in IMC.app/Contents/Resources/tools/imc-icon.
[package]
name = "imc-icon"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Scarica le icone delle app installate su un dispositivo iOS via SpringBoard."

# Nessuna dipendenza: la build gira anche offline dentro una fase di script di
# Xcode, e l'unica libreria esterna (libimobiledevice) arriva dal linker.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
# SpringBoard e' il nome del servizio di Apple, non un elemento di codice.
doc_markdown = "allow"
